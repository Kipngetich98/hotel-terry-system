version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: restaurant-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - restaurant-network
    restart: always

  redis:
    image: redis:7
    container_name: restaurant-redis
    ports:
      - "6379:6379"
    networks:
      - restaurant-network
    restart: always
    command: redis-server --save 60 1 --loglevel warning

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant-backend
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_SERVER=redis
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - restaurant-network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurant-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - restaurant-network
    restart: always

networks:
  restaurant-network:
    driver: bridge

volumes:
  postgres_data:
